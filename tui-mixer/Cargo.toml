[package]
name = "termixer"
version = "0.1.0"
edition = "2024"
description = "A TUI audio mixer with LPF/HPF controls for multiple audio sources"
authors = ["Daniel Tompkins"]

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"
tui-slider = "0.3"

# Async runtime for MPV IPC
tokio = { version = "1", features = ["full"] }

# JSON for MPV IPC protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# File globbing
glob = "0.3"

# Audio playback for samples
rodio = "0.22"

# Audio device enumeration (used by output.rs)
cpal = "0.17"
coreaudio-rs = { version = "0.13", optional = true }
jack = { version = "0.13", optional = true }
dasp = { version = "0.11", default-features = false, features = ["std", "signal", "slice", "ring_buffer", "rms"] }

# Lock-free primitives for the real-time audio path
triple_buffer = "8"       # SPSC snapshot: UI writes control state, audio reads latest
rtrb = "0.3"              # SPSC ring for audio commands (no Mutex)
arc-swap = "1"            # Atomic Arc swap for per-deck ring buffer handoff
crossbeam-queue = "0.3"   # Lock-free bounded queue for debug log capture

# Unicode display-width aware string handling
unicode-width = "0.2"

# BPM detection
stratum-dsp = "1.0"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "wav", "isomp4"] }

# Logging (optional, for debugging)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix process control (for stderr redirect)
libc = "0.2"

[features]
default = []
jack-backend = ["dep:jack"]
coreaudio-backend = ["dep:coreaudio-rs"]

[profile.release]
lto = true
codegen-units = 1
