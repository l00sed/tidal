[package]
name = "tidal-mixer"
version = "0.1.0"
edition = "2021"
description = "A TUI audio mixer with LPF/HPF controls for multiple audio sources"
authors = ["Your Name"]

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime for MPV IPC
tokio = { version = "1", features = ["full"] }

# JSON for MPV IPC protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# File globbing
glob = "0.3"

# Audio playback for samples
rodio = "0.22"

# Audio device enumeration (used by output.rs)
cpal = "0.17"

# BPM detection
stratum-dsp = "1.0"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "wav", "isomp4"] }

# Logging (optional, for debugging)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix process control (for stderr redirect)
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
